// Список короткий: всё общее приходит транзитивно из :core, который отдаёт
// свои зависимости через api.
dependencies {

    api project(':core')

    coreLibraryDesugaring libs.desugar.jdk.libs

    // Плагин hilt требует зависимость объявленной явно в самом модуле —
    // транзитивной через :core ему недостаточно.
    implementation(libs.hilt.android)
    ksp(libs.hilt.android.compiler)

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
}
