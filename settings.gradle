pluginManagement {
    // Convention-плагины проекта. Отдельная сборка, а не buildSrc: buildSrc
    // пересобирается и инвалидирует кеш на любое изменение, включённая сборка —
    // только на изменение самих плагинов.
    includeBuild('build-logic')

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()

        maven { url = uri('https://artifactory-external.vkpartner.ru/artifactory/maven/') }
        maven {
            url = uri("https://mobile.maven.couchbase.com/maven2/dev/")
            content { includeGroupByRegex "com\\.couchbase\\.lite.*" }
        }
    }
}
plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Вспомогательный заглушечный плагин на случай, если реальный jar Android Studio не найден.
class NoOpPlugin implements Plugin<Project> {
    void apply(Project target) {}
}

// Обход ошибки синхронизации Android Studio 2026.2.3 (Panda 4 / Rabbit 3).
// Студия инжектирует init-скрипт с `lifecycle.beforeProject { apply plugin: com.android.ide.gradle.model.builder.AndroidStudioToolingPlugin }`.
// В Gradle 8.8+ Gradle изолирует этот closure через ClosureCodec (BrokenScript) и теряет classpath скрипта,
// из-за чего Groovy падает с MissingPropertyException: com.
// Данный хук объявляет свойство com на каждом проекте, возвращая класс плагина из jar студии (или NoOpPlugin).
def resolveToolingPluginClass() {
    try {
        File jarFile = null
        File tempDir = new File(System.getProperty("java.io.tmpdir", "C:/Temp"))
        File[] initScripts = tempDir.listFiles({ dir, name -> name.startsWith("sync.studio.tooling") && name.endsWith(".gradle") } as FilenameFilter)
        if (initScripts != null && initScripts.length > 0) {
            Arrays.sort(initScripts, { a, b -> Long.compare(b.lastModified(), a.lastModified()) })
            def matcher = (initScripts[0].text =~ /mapPath\('([^']+android-gradle\.jar)'\)/)
            if (matcher.find()) {
                File f = new File(matcher.group(1))
                if (f.exists()) jarFile = f
            }
        }
        if (jarFile == null) {
            File fallback = new File("D:/AndroidStudio/android-studio-panda4-rc1-windows/android-studio/plugins/android/lib/android-gradle.jar")
            if (fallback.exists()) jarFile = fallback
        }
        if (jarFile != null) {
            URLClassLoader ucl = new URLClassLoader([jarFile.toURI().toURL()] as URL[], Project.class.classLoader)
            return ucl.loadClass("com.android.ide.gradle.model.builder.AndroidStudioToolingPlugin")
        }
    } catch (Throwable ignored) {}
    return NoOpPlugin
}

def toolingPluginClass = resolveToolingPluginClass()

gradle.beforeProject { p ->
    p.extensions.extraProperties.set('com', [
        android: [
            ide: [
                gradle: [
                    model: [
                        builder: [
                            AndroidStudioToolingPlugin: toolingPluginClass
                        ]
                    ]
                ]
            ]
        ]
    ])
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url = uri('https://jitpack.io') }
        maven { url = uri('https://artifactory-external.vkpartner.ru/artifactory/maven/') }
        maven {
            url = uri("https://mobile.maven.couchbase.com/maven2/dev/")
            content { includeGroupByRegex "com\\.couchbase\\.lite.*" }
        }
    }
}

rootProject.name = "xvideos"
include ':app'
include ':core'
include ':feature-l'
include ':feature-n'
include ':feature-x'
include ':feature-r'
include ':feature-xlive'
include ':baselineprofile'
